<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css" />
    <link href="./animali.css" rel="stylesheet" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
      <figure>
        <img src="https://picsum.photos/400/300" alt="Immagine Casuale" />
      </figure>
      <div class="lista-animali"></div>
    </main>
    <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
    <script type="text/babel">
      const { useState } = React;
      
      function Modal({
        title,
        content,
        show = false,
        onClose = () => {},
        onConfirm = () => {},
      }) {
        return (
          show &&
          ReactDOM.createPortal(
            <div className="modal-container">
              <div className="modal">
                <h2>{title}</h2>
                {content}
                <button onClick={onClose}>Annulla</button>
                <button onClick={onConfirm}>Conferma</button>
              </div>
            </div>,
            document.body,
          )
        );
      }

      const ListaAnimali = () => {
        const [animals, setAnimals] = useState([]);
        const [isOpen, setIsOpen] = useState(false);
        const [input, setInput] = useState("");

        const animalsChoices = [
          "Cane",
          "Gatto",
          "Pappagallo",
          "Cavallo",
          "Panda",
        ];
        return (
          <>
            <Modal
              show={isOpen}
              title="Aggiungi un animale"
              content={
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                />
              }
              onClose={() => setIsOpen(false)}
              onConfirm={() => {
                setAnimals([...animals, input]);
                setIsOpen(false);
                setInput("");
              }}
            />
            <button onClick={() => setIsOpen(true)}>Aggiungi Animale</button>
            <details>
              <summary>Animali</summary>
              <ul>
                {animals.map((animal, index) => (
                  <li key={index}>{animal}</li>
                ))}
              </ul>
            </details>
          </>
        );
      };

      const { createRoot } = ReactDOM;
      const listaAnimali = document.querySelector(".lista-animali");
      const root = createRoot(listaAnimali);
      root.render(<ListaAnimali />);
    </script>
  </body>
</html>
